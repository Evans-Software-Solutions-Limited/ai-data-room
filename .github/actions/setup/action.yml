name: "Setup"
description: "Setup the repository for CI/CD workflows"
inputs:
  restore_cache:
    description: "Restore dependency cache"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: "1.3.9"

    - name: Cache dependencies
      id: cache-deps
      uses: actions/cache@v4
      with:
        path: |
          ~/.bun/install/cache
          node_modules
          packages/*/node_modules
          microservices/*/node_modules
        key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock', 'bun.lockb') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-bun-
        lookup-only: ${{ inputs.restore_cache != 'true' }}

    - name: Install dependencies
      if: steps.cache-deps.outputs.cache-hit != 'true'
      shell: bash
      run: bun install --frozen-lockfile

    # NB: we deliberately do NOT run `bun sst install` in shared setup.
    # - The `install` job calls this action with `restore_cache: "false"`
    #   which makes the cache step lookup-only, so `node_modules` is not
    #   on disk — `bun sst install` would fail with
    #   "Script not found 'sst'".
    # - Typecheck doesn't need `.sst/platform/` thanks to the ambient
    #   shim at `infra/_sst-globals.d.ts`.
    # - Deploy jobs (`staging-deploy.yml`, `production-deploy.yml`,
    #   `pr-environment.yml`) bootstrap `.sst/platform/` implicitly on
    #   their first `sst` invocation — no manual prime needed.
