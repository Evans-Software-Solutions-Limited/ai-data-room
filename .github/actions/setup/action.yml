name: "Setup"
description: "Setup the repository for CI/CD workflows"
inputs:
  restore_cache:
    description: "Restore dependency cache"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: "1.3.9"

    - name: Cache dependencies
      id: cache-deps
      uses: actions/cache@v4
      with:
        path: |
          ~/.bun/install/cache
          node_modules
          packages/*/node_modules
          microservices/*/node_modules
        key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock', 'bun.lockb') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-bun-
        lookup-only: ${{ inputs.restore_cache != 'true' }}

    - name: Install dependencies
      if: steps.cache-deps.outputs.cache-hit != 'true'
      shell: bash
      run: bun install --frozen-lockfile

    # Bootstraps `.sst/platform/` so downstream `sst` CLI calls (diff,
    # deploy, shell) don't pay a cold install on every job. Typecheck
    # deliberately does NOT depend on `.sst/platform/` — it uses the
    # ambient shim at `infra/_sst-globals.d.ts` instead, so that SST's
    # own internal TS errors (on modern @types/node) can't break CI.
    # Idempotent; cheap; keep here so deploy jobs find a warm cache.
    - name: Bootstrap SST platform
      shell: bash
      run: bun sst install
